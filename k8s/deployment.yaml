# Despliegue en Kubernetes de booking-payment-service (namespace tripbus).
# Requiere los recursos compartidos de API-gateway/k8s/infra (ConfigMap, Secret, PostgreSQL, Redis).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-payment-service
  namespace: tripbus
  labels:
    app: booking-payment-service
    app.kubernetes.io/part-of: tripbus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-payment-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: booking-payment-service
        app.kubernetes.io/part-of: tripbus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "16004"
    spec:
      containers:
        - name: booking-payment-service
          image: ghcr.io/trip-bus/booking-payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 16004
              name: http
          envFrom:
            - configMapRef:
                name: tripbus-config
            - secretRef:
                name: tripbus-secrets
          env:
            - name: PAYMENT_WEBHOOK_URL
              value: http://booking-payment-service:16004/webhooks/payment
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: booking-payment-service
  namespace: tripbus
  labels:
    app: booking-payment-service
spec:
  selector:
    app: booking-payment-service
  ports:
    - name: http
      port: 16004
      targetPort: http
