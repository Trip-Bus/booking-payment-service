spring:
  application:
    name: booking-payment-service

  # "qa" y "prod" activan además el perfil "desplegado" (exige secretos, sin valores por defecto).
  profiles:
    group:
      qa: desplegado
      prod: desplegado

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:18104}/${DB_NAME:tripbus_booking}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking_qa_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:18100}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:18001/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:18004}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: booking-payment-service
  info:
    env:
      enabled: true
  health:
    # El SMTP del tiquete por correo (US-033) es opcional: su caída no debe sacar al servicio de rotación.
    mail:
      enabled: false

# /actuator/info: commit con el que se construyó la imagen (build-arg GIT_COMMIT del Dockerfile).
info:
  app:
    commit: ${APP_COMMIT:local}

tripbus:
  internal-token: ${INTERNAL_API_TOKEN:tripbus_internal_qa_token}
  events:
    enabled: ${EVENTS_ENABLED:true}
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:true}
    stream: ${EVENTS_STREAM:tripbus:events}
    max-len: 100000
    group: booking-payment-service
  booking:
    seat-inventory-url: ${SEAT_INVENTORY_URL:http://localhost:18003}
    catalog-url: ${CATALOG_URL:http://localhost:18002}
    flash-offers-url: ${FLASH_OFFERS_URL:http://localhost:18006}
    idempotency-ttl: 24h
    ticket-secret: ${TICKET_SECRET:tripbus_ticket_qa_secret}
    # US-150: reprogramar el tiquete. Sin reembolso por decisión del pasajero: si el viaje nuevo es más barato
    # no se devuelve la diferencia.
    reschedule-cutoff: 3h
    max-reschedules: 2
    reschedule-fee: 0
    # US-154/US-155: reservas afectadas por la empresa. Un retraso afecta si es de al menos affected-delay-min
    # minutos; el pasajero tiene affected-decision-window para elegir (después decide el sistema).
    affected-delay-min: 60
    affected-decision-window: 24h
    # US-144: identity dice si el comprador en taquilla tiene cuenta (por su correo). Opcional: si no responde,
    # la venta queda a nombre del operador.
    identity-url: ${IDENTITY_URL:http://localhost:18001}
    # US-153: un tiquete EMITIDO pasa a NO_SHOW cuando el viaje salió hace más de no-show-after. Se puede
    # reprogramar dentro de no-show-reschedule-window después de la salida, con un cargo de no-show-fee-percent
    # del total pagado (además de la diferencia de precio). Los de oferta no.
    no-show-after: 30m
    no-show-reschedule-enabled: ${NO_SHOW_RESCHEDULE_ENABLED:true}
    no-show-reschedule-window: 24h
    no-show-fee-percent: 20
    # US-145: al arrancar se rellenan los datos del viaje de las reservas que aún no los tienen.
    trip-backfill-enabled: ${TRIP_BACKFILL_ENABLED:true}
  payment:
    webhook-url: ${PAYMENT_WEBHOOK_URL:http://localhost:18004/webhooks/payment}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:tripbus_webhook_qa_secret}
    webhook-delay: 1500ms
    # Simula a la pasarela reenviando el mismo webhook (US-034: no debe cobrar ni emitir dos veces).
    # application-qa.yml lo fija en true y application-prod.yml en false.
    duplicate-webhook: ${PAYMENT_DUPLICATE_WEBHOOK:true}
    nequi-delay: ${PAYMENT_SANDBOX_NEQUI_DELAY:5s}
    pse-timeout: ${PAYMENT_SANDBOX_PSE_TIMEOUT:10m}
    sandbox-pages-enabled: ${PAYMENT_SANDBOX_PAGES_ENABLED:true}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # US-033: el tiquete se envía por correo con el QR adjunto. Sin MAIL_HOST el envío queda deshabilitado
  # (un WARN al arrancar); no es una variable obligatoria en ningún entorno.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: "${MAIL_FROM:TripBus <no-reply@tripbus.co>}"
