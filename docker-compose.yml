# Entorno QA de booking-payment-service SOLO (perfil Spring "qa"): su propia PostgreSQL, Redis con
# contraseña y el servicio construido desde este repo.
#
#   cp .env.example .env           # valores de QA local (el .env no se sube a git)
#   docker compose up -d --build   # levantar
#   docker compose ps              # esperar a que todo esté "healthy"
#   docker compose logs -f booking-payment-service
#   docker compose down            # detener conservando datos (down -v los borra)
#
# Qué se puede probar con este compose solo:
#   - /actuator/health, /actuator/info y Swagger (http://localhost:18004/swagger-ui.html).
#   - POST /webhooks/payment: no usa JWT sino la firma HMAC (X-Signature); una firma inválida
#     responde 401 INVALID_SIGNATURE y queda registrada en webhook_log.
#   - /bookings y /tickets exigen un JWT de identity y la compra completa necesita catalog,
#     seat-inventory y flash-offers: pruébalo con el compose general de API-gateway.
# identity (18001), catalog (18002), seat-inventory (18003) y flash-offers (18006) se buscan en tu
# PC vía host.docker.internal. La pasarela sandbox llama al webhook del propio servicio por su nombre
# dentro de Docker (booking-payment-service:18004).
#
# OJO: no lo corras a la vez que el compose general de API-gateway: usan los mismos puertos
# (18004, 18100, 18104) y fallaría con "port is already allocated".
name: tripbus-booking-payment-service

services:
  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tripbus_booking
      POSTGRES_USER: ${DB_USERNAME:?Falta DB_USERNAME en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    ports:
      - "18104:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}"]
    environment:
      # redis-cli lee la contraseña de aquí (así no aparece en la línea de comandos).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "18100:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-payment-service:
    build:
      context: .
      args:
        GIT_COMMIT: qa-local
    image: ghcr.io/trip-bus/booking-payment-service:qa-local
    env_file: .env
    # Estas ganan sobre .env: dentro de Docker se habla con los contenedores por nombre y puerto
    # interno, y con los servicios que corren en tu PC por host.docker.internal.
    environment:
      SPRING_PROFILES_ACTIVE: qa
      DB_HOST: booking-db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IDENTITY_JWKS_URI: http://host.docker.internal:18001/.well-known/jwks.json
      CATALOG_URL: http://host.docker.internal:18002
      SEAT_INVENTORY_URL: http://host.docker.internal:18003
      FLASH_OFFERS_URL: http://host.docker.internal:18006
      # La pasarela sandbox se llama a sí misma dentro de Docker.
      PAYMENT_WEBHOOK_URL: http://booking-payment-service:18004/webhooks/payment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18004:18004"
    depends_on:
      booking-db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  booking-db-data:
  redis-data:
